# AEO Loop: three agents that grow the search and AI-assistant visibility of {{repoFullName}}.
# Edit .kortix/aeo-loop/queries.md to choose the questions and competitors they track.
# Remove the template: delete this folder and its line under `imports:` in kortix.yaml.

agents:
  aeo-auditor:
    description: "Measures every week which tracked questions cite the site, and who is cited instead."
    mode: primary
    prompt_file: .kortix/aeo-loop/prompts/aeo-auditor.md
    secrets: "*"
    tools: "*"
    skills: "*"
  aeo-writer:
    description: "Turns the biggest visibility gap into one content pull request on the website."
    mode: primary
    prompt_file: .kortix/aeo-loop/prompts/aeo-writer.md
    secrets: "*"
    tools: "*"
    skills: "*"
  seo-fixer:
    description: "Crawls the deployed site and fixes technical SEO defects in a pull request."
    mode: primary
    prompt_file: .kortix/aeo-loop/prompts/seo-fixer.md
    secrets: "*"
    tools: "*"
    skills: "*"

triggers:
  - slug: aeo-weekly-audit
    name: Weekly visibility audit
    on:
      cron: "0 0 6 * * 1"
    max_runs_per_day: 1
    run:
      agent: aeo-auditor
      session: keyed
      session_key: "audit-{{ cron.scheduled_date }}"
      prompt: Audit the AI and search visibility of {{repoFullName}} for {{ cron.scheduled_date }}. Write the report to .kortix/aeo-loop/reports/{{ cron.scheduled_date }}.md.

  - slug: aeo-daily-content
    name: Daily content for the biggest gap
    on:
      cron: "0 0 9 * * *"
    max_runs_per_day: 1
    run:
      agent: aeo-writer
      session: keyed
      session_key: "content-{{ cron.scheduled_date }}"
      prompt: Close the biggest open visibility gap of {{repoFullName}} with one content pull request. Today is {{ cron.scheduled_date }}.

  - slug: seo-daily-crawl
    name: Daily technical SEO crawl
    on:
      cron: "0 0 4 * * *"
    max_runs_per_day: 1
    run:
      agent: seo-fixer
      session: keyed
      session_key: "crawl-{{ cron.scheduled_date }}"
      prompt: Crawl the deployed site of {{repoFullName}} and fix its technical SEO defects. Today is {{ cron.scheduled_date }}.
