name: Probe store fetch (temporary, removed before PR)

# Replays the Mobile Store sequence on its runner pool: two Expo API calls, a
# 700 s child process, then the call that failed in 3 ms in every automatic
# iOS release. `run` uses this branch's run() from store-release.mjs; `sync`
# is the execFileSync control. No secrets.
on:
  push:
    branches: [mobile-store-ios]

permissions:
  contents: read

jobs:
  probe:
    name: probe ${{ matrix.mode }}
    strategy:
      fail-fast: false
      matrix:
        mode: [run, sync]
    runs-on: ${{ vars.CI_RUNNER_M || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: apps/mobile/scripts
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Probe
        env:
          MODE: ${{ matrix.mode }}
        run: |
          cat > "$RUNNER_TEMP/probe.mjs" <<'EOF'
          import { execFileSync } from 'node:child_process';
          import { run, describeError } from './apps/mobile/scripts/store-release.mjs';
          const url = 'https://api.expo.dev/graphql';
          const body = JSON.stringify({ query: '{ __typename }' });
          const call = async (label) => {
            const t = Date.now();
            try {
              const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body });
              await r.text();
              console.log(`PROBE ${new Date().toISOString()} ${label} ${r.status} ${Date.now() - t} ms`);
            } catch (e) {
              console.log(`PROBE ${new Date().toISOString()} ${label} FAILED ${describeError(e)} ${Date.now() - t} ms`);
            }
          };
          await call('first');
          await call('second');
          if (process.env.MODE === 'run') await run('sleep', ['700']);
          else execFileSync('sleep', ['700']);
          await call('after-block');
          EOF
          cp "$RUNNER_TEMP/probe.mjs" ./probe.mjs
          node probe.mjs
