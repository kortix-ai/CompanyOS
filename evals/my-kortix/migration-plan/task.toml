schema_version = "1.4"

[metadata]
category = "planning"
difficulty = "medium"
tags = ["planning", "writing", "files"]

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 300.0
environment_mode = "shared"

[verifier.env]
# One judge model for every run: scores from two judges do not compare.
KORTIX_EVAL_JUDGE_MODEL = "deepseek-v4.1-flash"
