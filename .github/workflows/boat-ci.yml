name: Boat CI demo

on:
  push:
    branches: [boat-ci-demo]
  workflow_dispatch:

jobs:
  test:
    runs-on: boat
    steps:
      - uses: actions/checkout@v4
      - name: Runner info
        run: |
          uname -a
          nproc
          free -h || true
          df -h . || true
      - uses: pnpm/action-setup@v4
        with:
          version: 8.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: pnpm install --frozen-lockfile
