# Auto-Security Loop: agents that pentest {{repoFullName}} around the clock.
# Remove the template: delete this folder and its line under `imports:` in kortix.yaml.

agents:
  red-team:
    description: "Nightly: starts the app in its own dev sandbox and attacks it, then reports proven findings."
    mode: primary
    prompt_file: .kortix/security-loop/prompts/red-team.md
    secrets: "*"
    tools: "*"
    skills: "*"
  pr-scan:
    description: "Scans each pull request diff for security defects and posts one review."
    mode: primary
    prompt_file: .kortix/security-loop/prompts/pr-scan.md
    secrets: "*"
    tools: "*"
    skills: "*"
  patcher:
    description: "Turns a confirmed security finding into a fix pull request with a regression test."
    mode: primary
    prompt_file: .kortix/security-loop/prompts/patcher.md
    secrets: "*"
    tools: "*"
    skills: "*"
  dependency-watch:
    description: "Weekly: audits the lockfiles for known CVEs and reports the actionable ones."
    mode: primary
    prompt_file: .kortix/security-loop/prompts/dependency-watch.md
    secrets: "*"
    tools: "*"
    skills: "*"

triggers:
  - slug: security-nightly
    name: Nightly red team
    on:
      cron: "0 0 2 * * *"
    max_runs_per_day: 2
    run:
      agent: red-team
      session: fresh
      prompt: Attack {{repoFullName}} on {{defaultBranch}} in a fresh dev sandbox. Report every proven finding.

  - slug: security-pr-scan
    name: Scan pull requests
    on:
      webhook: { secret: SECURITY_GITHUB_WEBHOOK_SECRET }
    filter:
      headers.github_event: pull_request
      body.action: { in: [opened, ready_for_review, reopened, synchronize] }
      body.pull_request.draft: "false"
    max_runs_per_hour: 20
    run:
      agent: pr-scan
      session: keyed
      session_key: "pr-{{ body.pull_request.number }}"
      prompt: |
        Scan pull request #{{ body.pull_request.number }} in {{ body.repository.full_name }} for security defects: {{ body.pull_request.title }}
        {{ body.pull_request.html_url }}
        Base {{ body.pull_request.base.ref }}, head {{ body.pull_request.head.ref }}.

  - slug: security-patch
    name: Patch confirmed findings
    on:
      webhook: { secret: SECURITY_GITHUB_WEBHOOK_SECRET }
    filter:
      headers.github_event: issues
      body.action: labeled
      body.label.name: security-fix
    max_runs_per_hour: 10
    run:
      agent: patcher
      session: keyed
      session_key: "finding-{{ body.issue.number }}"
      prompt: |
        Patch confirmed finding #{{ body.issue.number }} in {{ body.repository.full_name }}: {{ body.issue.title }}
        {{ body.issue.html_url }}

        {{ body.issue.body }}

  - slug: security-dependency-watch
    name: Weekly dependency audit
    on:
      cron: "0 0 4 * * 1"
    max_runs_per_day: 1
    run:
      agent: dependency-watch
      prompt: Audit the lockfiles of {{repoFullName}} on {{defaultBranch}} and report actionable CVEs.
