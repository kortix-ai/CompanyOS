# TEMPORARY verification for the vercel-prebuilt branch. Deleted before merge.
# Runs the staging Vercel job's build-and-deploy on the real runner, without
# the alias: it creates one unaliased preview deployment of the suna project.
name: zz vercel prebuilt probe
on:
  push:
    branches: [vercel-prebuilt]
permissions:
  contents: read
  id-token: write
env:
  PUBLIC_API_HOST: staging-api.kortix.com
  WEB_HOST: staging.kortix.com
jobs:
  probe:
    runs-on: ${{ vars.CI_RUNNER_M || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/aws-env
        with:
          keys: |
            VERCEL_TOKEN
            VERCEL_PROJECT_ID
            VERCEL_TEAM_ID
            NEXT_PUBLIC_SUPABASE_URL=kortix-staging-env:SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_ANON_KEY=kortix-staging-env:SUPABASE_ANON_KEY
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable pnpm
      - name: Runner size
        run: nproc; free -g; df -h . | tail -1
      - name: Build on this runner and deploy an unaliased preview
        env:
          npm_config_engine_strict: "false"
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export VERCEL_ORG_ID="$VERCEL_TEAM_ID"
          staging_env=(
            NEXT_PUBLIC_BACKEND_URL="https://${PUBLIC_API_HOST}/v1"
            KORTIX_PUBLIC_BACKEND_URL="https://${PUBLIC_API_HOST}/v1"
            NEXT_PUBLIC_APP_URL="https://${WEB_HOST}"
            KORTIX_PUBLIC_APP_URL="https://${WEB_HOST}"
            NEXT_PUBLIC_URL="https://${WEB_HOST}"
            SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL"
            SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY"
            NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL"
            KORTIX_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL"
            NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY"
            KORTIX_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY"
            BACKEND_URL="https://${PUBLIC_API_HOST}/v1"
            APP_URL="https://${WEB_HOST}"
            NEXT_PUBLIC_BILLING_ENABLED="true"
            KORTIX_PUBLIC_BILLING_ENABLED="true"
            AUTH_PROVIDERS="google"
            NEXT_PUBLIC_AUTH_PROVIDERS="google"
            KORTIX_PUBLIC_AUTH_PROVIDERS="google"
            AUTH_METHODS="magic,password"
            NEXT_PUBLIC_AUTH_METHODS="magic,password"
            KORTIX_PUBLIC_AUTH_METHODS="magic,password"
          )
          env_flags=()
          for kv in "${staging_env[@]}"; do env_flags+=(--env "$kv" --build-env "$kv"); done
          start=$(date +%s)
          url="$(bash infra/scripts/vercel-deploy-prebuilt.sh preview \
            "${env_flags[@]}" \
            --env KORTIX_PUBLIC_VERSION=0.0.0-runtime-probe \
            --build-env NEXT_PUBLIC_KORTIX_VERSION=0.0.0-build-probe \
            --build-env NEXT_PUBLIC_KORTIX_COMMIT="$SOURCE_SHA" \
            | tail -n1)"
          echo "PROBE_ELAPSED $(( $(date +%s) - start ))s"
          echo "PROBE_URL ${url}"
          jq -c '{deploymentId}' .vercel/output/config.json || true
